<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FormSahay - Check Your Eligibility for Government Welfare Schemes">
  <title>FormSahay | Eligibility Checker</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/eligibility.css">
</head>
<body>

  <!-- Header Navigation -->
 

  <!-- Main Content -->
  <main class="container eligibility-container">

    <!-- Portal Badge -->
    <div class="portal-badge">
      <span class="portal-badge-icon">✅</span>
      <span class="portal-badge-text">Find Your Eligible Schemes</span>
    </div>

    <!-- Page Title -->
    <h1 class="eligibility-title">
      सरकारी योजना पात्रता जांच
      <br>
      <span style="font-size: 0.7em; color: #666; font-weight: 400;">Government Schemes Eligibility Checker</span>
    </h1>

    

    <!-- Main Content Grid -->
    <div class="eligibility-grid">

      <!-- Left Column: Form -->
      <div class="form-section">
        <h2 class="form-title">📋 Your Details</h2>

        <form id="eligibility-form" class="eligibility-form">
          
          <!-- Age Input -->
          <div class="form-group">
            <label for="age">
              <span class="label-icon">👤</span>
              <span class="label-text">Age (Years)</span>
            </label>
            <input type="number" id="age" required min="1" max="120" placeholder="e.g., 45" class="form-input">
          </div>

          <!-- Income Input -->
          <div class="form-group">
            <label for="income">
              <span class="label-icon">💰</span>
              <span class="label-text">Annual Income (₹)</span>
            </label>
            <input type="number" id="income" required min="0" placeholder="e.g., 300000" class="form-input">
          </div>

          <!-- State Select -->
          <div class="form-group">
            <label for="state">
              <span class="label-icon">📍</span>
              <span class="label-text">State</span>
            </label>
            <select id="state" class="form-select">
              <option value="Maharashtra">Maharashtra</option>
              <option value="Delhi">Delhi</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Occupation Select -->
          <div class="form-group">
            <label for="occupation">
              <span class="label-icon">💼</span>
              <span class="label-text">Occupation</span>
            </label>
            <select id="occupation" class="form-select">
              <option value="farmer">Farmer</option>
              <option value="student">Student</option>
              <option value="entrepreneur">Entrepreneur / Business Owner</option>
              <option value="vendor">Street Vendor</option>
              <option value="artisan">Artisan / Craftsperson</option>
              <option value="pregnant">Pregnant / Lactating Mother</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Social Category (Caste) Select -->
          <div class="form-group">
            <label for="caste">
              <span class="label-icon">🏛️</span>
              <span class="label-text">Social Category</span>
            </label>
            <select id="caste" class="form-select">
              <option value="general">General / Open</option>
              <option value="sc">Scheduled Caste (SC)</option>
              <option value="st">Scheduled Tribe (ST)</option>
              <option value="obc">Other Backward Class (OBC)</option>
            </select>
          </div>

          <!-- Gender Select -->
          <div class="form-group">
            <label for="gender">
              <span class="label-icon">⚧️</span>
              <span class="label-text">Gender</span>
            </label>
            <select id="gender" class="form-select">
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">
            🔍 Check Eligible Schemes
          </button>
        </form>
      </div>

      <!-- Right Column: Results -->
      <div class="results-section">
        <h2 class="results-title">📊 Your Matching Schemes</h2>

        <div id="results-container" class="results-container">
          <div class="results-placeholder">
            <div class="placeholder-icon">📝</div>
            <p class="placeholder-text">Fill the form and click "Check Eligible Schemes" to discover programs for you.</p>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
 

  <!-- Scripts -->
  <script src="/eligibilityEngine.js"></script>
  <script>
    // Back to Home Button Handler
    document.getElementById('btn-back-home').addEventListener('click', function() {
      window.location.href = '/';
    });
  </script>

</body>
</html>
